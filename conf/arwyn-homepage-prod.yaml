productName: arwyn-homepage
imageName: ghcr.io/arwynfr/stack-homepage/homepage-docker

securityContext:
  runAsUser: 101

resources:
  requests:
    cpu: 10m
    memory: 32Mi
    storage: 0
  limits:
    cpu: 100m
    memory: 128Mi
    storage: 1Gi

ingress:
  fromToWwwRedirect: true
  hostname: www.arwyn.fr
  alternate: arwyn.fr
