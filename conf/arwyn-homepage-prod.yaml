product:
  name: arwyn-homepage

image:
  name: ghcr.io/arwynfr/stack-homepage/homepage-docker

securityContext:
  runAsUser: 101

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

dns:
  hostnames:
    - www.arwyn.fr
  subjectAlternativeNames:
    - arwyn.fr
