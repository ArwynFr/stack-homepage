apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-website
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
    app.kubernetes.io/component: website
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homepage.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: website
  template:
    metadata:
      labels:
        {{- include "homepage.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: website
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: "{{ .Values.imageName }}:{{ .Chart.Version }}"
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              ephemeral-storage: {{ .Values.resources.requests.storage }}
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              ephemeral-storage: {{ .Values.resources.limits.storage }}
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
