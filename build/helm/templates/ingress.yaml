{{- $hosts := list .Values.ingress.hostname -}}
{{- if .Values.ingress.fromToWwwRedirect -}}
  {{- $hosts = append $hosts .Values.ingress.alternate -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-website
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
    app.kubernetes.io/component: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: {{ $hosts | join "," | quote }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: {{ .Values.ingress.fromToWwwRedirect | quote }}
spec:
  tls:
    - secretName: {{ .Release.Name }}-cert
      hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-website
                port:
                  number: 80
