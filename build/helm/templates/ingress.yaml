apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-website
  labels:
    {{- include "labels" . | nindent 4 }}
    app.kubernetes.io/component: website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: {{ concat .Values.dns.hostnames .Values.dns.subjectAlternativeNames | join "," | quote }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
spec:
  tls:
    - secretName: {{ .Release.Name }}-cert
      hosts:
        {{- range (concat .Values.dns.hostnames .Values.dns.subjectAlternativeNames) }}
        - {{ . | quote }}
        {{- end }}
  rules:
    {{- range .Values.dns.hostnames }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-website
                port:
                  number: 80
    {{- end }}
