apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-website
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
    app.kubernetes.io/component: website
spec:
  selector:
    {{- include "homepage.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: website
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
